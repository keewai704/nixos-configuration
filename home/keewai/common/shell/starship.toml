format = """
[](fg:cyan)\
[  ](fg:black bg:cyan)\
$directory\
[](fg:cyan bg:black)\
$git_branch\
$git_status\
$nix_shell\
$c\
$golang\
$nodejs\
$php\
$python\
$rust\
[](fg:black)\
$cmd_duration
$character"""

right_format = "$time"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
format = "[$path$read_only ]($style)"
style = "fg:black bg:cyan bold"
read_only = " 󰌾"
read_only_style = "fg:black bg:cyan"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "

[git_branch]
format = "[ $symbol $branch ]($style)"
style = "fg:cyan bg:black"
symbol = ""

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "fg:yellow bg:black"

[nix_shell]
format = "[ $symbol $state ]($style)"
style = "fg:blue bg:black"
symbol = ""
impure_msg = "impure"
pure_msg = "pure"

[c]
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:black"
symbol = ""

[golang]
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:black"
symbol = ""

[nodejs]
format = "[ $symbol $version ]($style)"
style = "fg:green bg:black"
symbol = "󰎙"

[php]
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:black"
symbol = ""

[python]
format = "[ $symbol $version ]($style)"
style = "fg:yellow bg:black"
symbol = ""

[rust]
format = "[ $symbol $version ]($style)"
style = "fg:red bg:black"
symbol = ""

[cmd_duration]
format = " [󰔟 $duration]($style)"
style = "fg:yellow"
min_time = 2000
show_notifications = true

[time]
disabled = false
format = "[$time]($style)"
style = "fg:white"
time_format = "%R"
