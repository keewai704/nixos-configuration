format = """
[\ue0b6](fg:cyan)\
[\uf313 ](fg:black bg:cyan)\
$directory\
[\ue0b4](fg:cyan bg:black)\
$git_branch\
$git_status\
$nix_shell\
$c\
$golang\
$nodejs\
$php\
$python\
$rust\
[\ue0b4](fg:black)\
$cmd_duration
$character"""

right_format = "$time"

[character]
success_symbol = "[\u276f](bold cyan)"
error_symbol = "[\u276f](bold red)"
vimcmd_symbol = "[\u276e](bold green)"

[directory]
format = "[$path$read_only ]($style)"
style = "fg:black bg:cyan bold"
read_only = " \U000f033e"
read_only_style = "fg:black bg:cyan"
truncation_length = 3
truncation_symbol = "\u2026/"

[directory.substitutions]
Documents = "\U000f0219 "
Downloads = "\uf019 "
Music = "\U000f075a "
Pictures = "\uf03e "

[git_branch]
format = "[ $symbol $branch ]($style)"
style = "fg:cyan bg:black"
symbol = "\ue0a0"

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "fg:yellow bg:black"

[nix_shell]
format = "[ $symbol $state ]($style)"
style = "fg:blue bg:black"
symbol = "\uf313"
impure_msg = "impure"
pure_msg = "pure"

[c]
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:black"
symbol = "\ue61e"

[golang]
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:black"
symbol = "\ue627"

[nodejs]
format = "[ $symbol $version ]($style)"
style = "fg:green bg:black"
symbol = "\U000f0399"

[php]
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:black"
symbol = "\ue608"

[python]
format = "[ $symbol $version ]($style)"
style = "fg:yellow bg:black"
symbol = "\ue606"

[rust]
format = "[ $symbol $version ]($style)"
style = "fg:red bg:black"
symbol = "\ue7a8"

[cmd_duration]
format = " [\U000f051f $duration]($style)"
style = "fg:yellow"
min_time = 2000
show_notifications = true

[time]
disabled = false
format = "[$time]($style)"
style = "fg:white"
time_format = "%R"
