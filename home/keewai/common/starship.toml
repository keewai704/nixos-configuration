format = """
[░▒▓](magenta)\
[ 󰣇 ](bg:magenta fg:black)\
[](bg:blue fg:magenta)\
$directory\
[](fg:blue bg:bright-black)\
$git_branch\
$git_status\
[](fg:bright-black bg:black)\
$nodejs\
$rust\
$golang\
$php\
$python\
$c\
[](fg:black bg:bright-black)\
$time\
[](fg:bright-black bg:black)\
$cmd_duration\
[ ](fg:black)\
\n$character"""

[directory]
style = "fg:black bg:blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:bright-black"
format = '[[ $symbol $branch ](fg:blue bg:bright-black)]($style)'

[git_status]
style = "bg:bright-black"
format = '[[($all_status$ahead_behind )](fg:blue bg:bright-black)]($style)'

[nodejs]
symbol = "󰎙"
style = "bg:black"
format = '[[ $symbol ($version) ](fg:blue bg:black)]($style)'

[rust]
symbol = ""
style = "bg:black"
format = '[[ $symbol ($version) ](fg:blue bg:black)]($style)'

[golang]
symbol = ""
style = "bg:black"
format = '[[ $symbol ($version) ](fg:blue bg:black)]($style)'

[php]
symbol = ""
style = "bg:black"
format = '[[ $symbol ($version) ](fg:blue bg:black)]($style)'

[python]
symbol = ""
style = "bg:black"
format = '[[ $symbol ($version) ](fg:blue bg:black)]($style)'

[c]
symbol = ""
style = "bg:black"
format = '[[ $symbol ($version) ](fg:blue bg:black)]($style)'


[time]
disabled = false
time_format = "%R"
style = "bg:bright-black"
format = '[[  $time ](fg:white bg:bright-black)]($style)'

[cmd_duration]
show_milliseconds = true
min_time = 0
format = '[[ ⏱️ $duration ](fg:white bg:black)]($style)'
style = "bg:black"
disabled = false
show_notifications = true
